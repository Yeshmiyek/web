<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  
    <header>
  <div class="header-left">
  </div>
  <div class="header-right">
    <img class="logo" src="images/yellow-logo.png" alt="yeshmiyek">
 </div>
    </header>
    
    <main class="pack">
  <section class="pack-info">
    <div class="cover">cover</div>
    <div class="lower-third">
      <p>samples</p>
      <p>"ymy v1"</p>
      <p>[$1.29]</p>
    </div>
  </section>

 <section class="panel" aria-label="sample player">
  <div class="track-head">
    <span>the rotation</span>
    <span>03 tracks</span>
  </div>

  <div class="track-list">
    <button type="button" class="track is-active" data-src="audio/loop-one.mp3" data-title="loop one" data-duration="0:32">
      <span class="num">01</span><b class="name">loop one</b><time>0:32</time>
    </button>
    <button type="button" class="track" data-src="audio/loop-two.mp3" data-title="loop two" data-duration="0:30">
      <span class="num">02</span><b class="name">loop two</b><time>0:30</time>
    </button>
    <button type="button" class="track" data-src="audio/loop-three.mp3" data-title="loop three" data-duration="0:28">
      <span class="num">03</span><b class="name">loop three</b><time>0:28</time>
    </button>
  </div>

  <div class="controls">
    <div class="transport">
      <button type="button" id="prev-btn" class="btn" aria-label="previous">|&#9664;&#xFE0E;</button>
      <button type="button" id="play-btn" class="btn play">&#9654;&#xFE0E; play</button>
      <button type="button" id="next-btn" class="btn" aria-label="next">&#9654;&#xFE0E;|</button>
    </div>

    <div class="scrub">
      <time id="current-time">0:00</time>
      <input id="progress" type="range" min="0" max="100" value="0" aria-label="playback progress">
      <time id="total-time">0:32</time>
    </div>

    <p class="status" id="now-playing">previewing: loop one</p>
  </div>

  <audio id="audio" preload="metadata"></audio>
</section>
</main>

    
<script src="player.js"></script>

<footer class="bar">
  <div class="bar-links">
    <a href="sample-packs.html">← Back</a>
    <a href="#">Licenses</a>
    <a href="#">Contact</a>
  </div>
  <small>© 2026 yeshmiyek — all rights reserved</small>
</footer>

</body>
</html>
