<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  
    <header>
  <div class="header-left">
  </div>
  <div class="header-right">
    <img class="logo" src="images/yellow-logo.png" alt="yeshmiyek">
 </div>
    </header>
    
    <main class="pack">
  <section class="pack-info">
    <div class="cover">cover</div>
    <div class="lower-third">
      <p>samples</p>
      <p>"ymy v1"</p>
      <p>[$1.29]</p>
    </div>
  </section>

  <section class="panel">


    <ol class="tracklist">
      <li class="track selected"><button type="button"><span class="num">01</span><span class="name">loop one</span><span class="time">0:32</span></button></li>
      <li class="track"><button type="button"><span class="num">02</span><span class="name">loop two</span><span class="time">0:30</span></button></li>
      <li class="track"><button type="button"><span class="num">03</span><span class="name">loop three</span><span class="time">0:28</span></button></li>
    </ol>

    <div class="player">
      <button type="button">prev</button>
      <button type="button">play</button>
      <button type="button">next</button>
      <div class="progress"><div class="progress-fill"></div></div>
      <span class="time-display">0:00 / 0:32</span>
    </div>
  </section>
</main>

    
<script src="script.js"></script>

<footer class="bar">
  <div class="bar-links">
    <a href="sample-packs.html">← Back</a>
    <a href="#">Licenses</a>
    <a href="#">Contact</a>
  </div>
  <small>© 2026 yeshmiyek — all rights reserved</small>
</footer>

</body>
</html>
